<!-- assets/img/icons/sprite.svg — idleVaction icon sprite (Phase 6C).
     Hand-authored <symbol> defs, 24x24 viewBox, 2-4 flat shapes each, holiday palette
     (sunshine #FFC800, hot pink #FF2E88, sky blue #45C4FF, apple green #7ED957, warm
     neutrals). This file is the source/reference copy — the SAME markup is inlined
     (hidden) at the top of index.html's <body> so <use href="#ic-..."> resolves with
     zero fetch/build step (GitHub-Pages-static, no bundler). Keep both in sync by hand
     when editing an icon.
     Opening this file directly renders nothing visible (symbols only, by design) — it's
     a defs library, not a standalone image. -->
<svg xmlns="http://www.w3.org/2000/svg" style="display:none">

  <!-- chrome: tabs, header chips, next/story affordances -->

  <symbol id="ic-home" viewBox="0 0 24 24"><!-- beach hut -->
    <path d="M2 11 L12 4 L22 11" fill="none" stroke="#FFC800" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="5" y="11" width="14" height="9" rx="1.5" fill="#E8B979"/>
    <rect x="10.5" y="15" width="3" height="5" rx="0.5" fill="#2B1E16"/>
  </symbol>

  <symbol id="ic-income" viewBox="0 0 24 24"><!-- rising bars -->
    <rect x="3" y="14" width="4" height="7" rx="1" fill="#7ED957"/>
    <rect x="10" y="9" width="4" height="12" rx="1" fill="#FFC800"/>
    <rect x="17" y="4" width="4" height="17" rx="1" fill="#FF2E88"/>
  </symbol>

  <symbol id="ic-growth" viewBox="0 0 24 24"><!-- sprout -->
    <path d="M12 21 V11" stroke="#2E7D24" stroke-width="2" stroke-linecap="round"/>
    <path d="M12 12 C12 12 6 12 5 6 C11 6 12 12 12 12 Z" fill="#7ED957"/>
    <path d="M12 13 C12 13 18 12 19 7 C13 7 12 13 12 13 Z" fill="#7ED957"/>
  </symbol>

  <symbol id="ic-legacy" viewBox="0 0 24 24"><!-- medal + ribbon -->
    <circle cx="12" cy="9" r="6" fill="#FFC800"/>
    <circle cx="12" cy="9" r="3" fill="#FFF6E9"/>
    <path d="M8 14 L6 21 L12 18 L18 21 L16 14 Z" fill="#FF2E88"/>
  </symbol>

  <symbol id="ic-money" viewBox="0 0 24 24"><!-- banknote -->
    <rect x="2" y="6" width="20" height="12" rx="2" fill="#7ED957"/>
    <circle cx="12" cy="12" r="3.4" fill="#FFF6E9"/>
    <circle cx="12" cy="12" r="1.6" fill="#FFC800"/>
  </symbol>

  <symbol id="ic-wallet" viewBox="0 0 24 24"><!-- bank-account wallet -->
    <rect x="2" y="6" width="20" height="14" rx="3" fill="#E8B979"/>
    <rect x="14" y="11" width="8" height="6" rx="1.5" fill="#FF2E88"/>
    <circle cx="18" cy="14" r="1" fill="#FFF6E9"/>
  </symbol>

  <symbol id="ic-next" viewBox="0 0 24 24"><!-- chevron -->
    <path d="M8 4 L17 12 L8 20" fill="none" stroke="#FF2E88" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  </symbol>

  <symbol id="ic-comfort" viewBox="0 0 24 24"><!-- lounger + parasol -->
    <path d="M12 2 V9" stroke="#E8B979" stroke-width="1.6" stroke-linecap="round"/>
    <path d="M4 8 C4 4 20 4 20 8 Z" fill="#FF2E88"/>
    <path d="M3 20 L9 13 L21 13 L15 20 Z" fill="#45C4FF"/>
  </symbol>

  <symbol id="ic-clout" viewBox="0 0 24 24"><!-- starburst -->
    <path d="M12 2 L14.2 9.8 L22 12 L14.2 14.2 L12 22 L9.8 14.2 L2 12 L9.8 9.8 Z" fill="#FF2E88"/>
    <circle cx="18.5" cy="5.5" r="1.6" fill="#FFC800"/>
  </symbol>

  <symbol id="ic-story" viewBox="0 0 24 24"><!-- open storybook -->
    <path d="M12 5 C9 3.5 5 3.5 2 5 V19 C5 17.5 9 17.5 12 19 Z" fill="#45C4FF"/>
    <path d="M12 5 C15 3.5 19 3.5 22 5 V19 C19 17.5 15 17.5 12 19 Z" fill="#FFC800"/>
    <path d="M12 5 V19" stroke="#2B1E16" stroke-width="1.2"/>
  </symbol>

  <!-- amenity category icons (one per DATA tag, js/data/amenities.js) -->

  <symbol id="ic-am-backpack" viewBox="0 0 24 24">
    <rect x="5" y="8" width="14" height="13" rx="4" fill="#E8B979"/>
    <rect x="8" y="3" width="8" height="6" rx="3" fill="#7ED957"/>
    <rect x="9" y="12" width="6" height="4" rx="1" fill="#2B1E16"/>
  </symbol>

  <symbol id="ic-am-beach" viewBox="0 0 24 24">
    <circle cx="7" cy="7" r="4" fill="#FFC800"/>
    <path d="M2 16 C6 13 10 19 14 16 C18 13 22 19 22 19" fill="none" stroke="#45C4FF" stroke-width="2" stroke-linecap="round"/>
  </symbol>

  <symbol id="ic-am-breakfast" viewBox="0 0 24 24">
    <path d="M4 9 H16 V15 A6 6 0 0 1 4 15 Z" fill="#E8B979"/>
    <path d="M16 10 C20 10 20 15 16 15" fill="none" stroke="#2B1E16" stroke-width="1.8"/>
    <path d="M8 6 C7 4.5 9 3.5 8 2" fill="none" stroke="#FF2E88" stroke-width="1.6" stroke-linecap="round"/>
  </symbol>

  <symbol id="ic-am-butler" viewBox="0 0 24 24"><!-- bow tie -->
    <path d="M3 8 L11 12 L3 16 Z" fill="#2B1E16"/>
    <path d="M21 8 L13 12 L21 16 Z" fill="#2B1E16"/>
    <circle cx="12" cy="12" r="2.4" fill="#FF2E88"/>
  </symbol>

  <symbol id="ic-am-cryptogear" viewBox="0 0 24 24"><!-- coin, up arrow -->
    <circle cx="12" cy="12" r="9" fill="#FFC800"/>
    <path d="M8 13 L12 7 L16 13 M12 8 V17" fill="none" stroke="#2B1E16" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  </symbol>

  <symbol id="ic-am-destination" viewBox="0 0 24 24"><!-- map pin -->
    <path d="M12 2 C7 2 4 5.5 4 10 C4 15.5 12 22 12 22 C12 22 20 15.5 20 10 C20 5.5 17 2 12 2 Z" fill="#FF2E88"/>
    <circle cx="12" cy="10" r="3.4" fill="#FFF6E9"/>
  </symbol>

  <symbol id="ic-am-gear" viewBox="0 0 24 24"><!-- camera -->
    <rect x="2" y="7" width="20" height="13" rx="2.5" fill="#2B1E16"/>
    <rect x="8" y="4" width="6" height="4" rx="1" fill="#2B1E16"/>
    <circle cx="12" cy="13.5" r="4.4" fill="#45C4FF"/>
    <circle cx="18" cy="10" r="1" fill="#FFC800"/>
  </symbol>

  <symbol id="ic-am-grounds" viewBox="0 0 24 24"><!-- tree -->
    <rect x="10.5" y="14" width="3" height="7" rx="1" fill="#E8B979"/>
    <circle cx="12" cy="9" r="7" fill="#7ED957"/>
  </symbol>

  <symbol id="ic-am-gym" viewBox="0 0 24 24"><!-- dumbbell -->
    <rect x="6" y="10.5" width="12" height="3" rx="1" fill="#2B1E16"/>
    <rect x="2" y="7" width="5" height="10" rx="1.5" fill="#FF2E88"/>
    <rect x="17" y="7" width="5" height="10" rx="1.5" fill="#FF2E88"/>
  </symbol>

  <symbol id="ic-am-hostel" viewBox="0 0 24 24"><!-- bunk bed -->
    <rect x="3" y="4" width="18" height="5" rx="1.2" fill="#45C4FF"/>
    <rect x="3" y="14" width="18" height="5" rx="1.2" fill="#FFC800"/>
    <rect x="3" y="4" width="3" height="15" rx="1" fill="#2B1E16"/>
  </symbol>

  <symbol id="ic-am-island" viewBox="0 0 24 24">
    <ellipse cx="12" cy="19" rx="9" ry="2.6" fill="#FFC800"/>
    <path d="M12 18 C12 18 12 6 7 4" fill="none" stroke="#E8B979" stroke-width="1.8" stroke-linecap="round"/>
    <path d="M7 4 C4 3 3 6 5 8 C7 6 9 4 7 4 Z" fill="#7ED957"/>
  </symbol>

  <symbol id="ic-am-jet" viewBox="0 0 24 24">
    <path d="M2 13 L18 9 L22 11 L18 13 L14 21 L11 20 L13 13.5 L6 15 L4 17 L2 16.5 L4 13.5 Z" fill="#45C4FF"/>
  </symbol>

  <symbol id="ic-am-luxury" viewBox="0 0 24 24"><!-- gem -->
    <path d="M4 9 L12 3 L20 9 L12 21 Z" fill="#45C4FF"/>
    <path d="M4 9 L20 9 L12 21 Z" fill="#FFF6E9" opacity="0.35"/>
  </symbol>

  <symbol id="ic-am-motel" viewBox="0 0 24 24"><!-- single bed -->
    <rect x="2" y="13" width="20" height="7" rx="1.5" fill="#E8B979"/>
    <rect x="4" y="9" width="7" height="5" rx="2" fill="#FFF6E9"/>
    <rect x="2" y="13" width="2.5" height="8" rx="1" fill="#2B1E16"/>
  </symbol>

  <symbol id="ic-am-pool" viewBox="0 0 24 24">
    <rect x="2" y="6" width="20" height="10" rx="3" fill="#45C4FF"/>
    <path d="M2 19 C5 17.5 7 20.5 10 19 C13 17.5 15 20.5 18 19 C19.5 18.3 20.5 18.5 22 19" fill="none" stroke="#0E7FC0" stroke-width="1.8" stroke-linecap="round"/>
  </symbol>

  <symbol id="ic-am-property" viewBox="0 0 24 24"><!-- house, distinct from ic-home -->
    <path d="M3 12 L12 4 L21 12 V20 H3 Z" fill="#E8B979"/>
    <path d="M3 12 L12 4 L21 12" fill="none" stroke="#2E7D24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="10" y="14" width="4" height="6" rx="0.5" fill="#2B1E16"/>
  </symbol>

  <symbol id="ic-am-quarters" viewBox="0 0 24 24"><!-- door -->
    <rect x="6" y="3" width="12" height="18" rx="1.5" fill="#E8B979"/>
    <circle cx="15" cy="12" r="1.3" fill="#2B1E16"/>
  </symbol>

  <symbol id="ic-am-service" viewBox="0 0 24 24"><!-- bell -->
    <path d="M4 17 C4 10 8 7 12 7 C16 7 20 10 20 17 Z" fill="#FFC800"/>
    <rect x="3" y="17" width="18" height="2.4" rx="1.2" fill="#2B1E16"/>
    <circle cx="12" cy="4.5" r="1.6" fill="#FF2E88"/>
  </symbol>

  <symbol id="ic-am-signature" viewBox="0 0 24 24"><!-- pen flourish -->
    <path d="M2 17 C6 17 6 9 10 9 C13 9 10 19 14 19 C18 19 15 8 22 8" fill="none" stroke="#FF2E88" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="22" cy="6.5" r="1.4" fill="#FFC800"/>
  </symbol>

  <symbol id="ic-am-spa" viewBox="0 0 24 24"><!-- droplet -->
    <path d="M12 2 C16 8 18 11 18 14.5 A6 6 0 0 1 6 14.5 C6 11 8 8 12 2 Z" fill="#45C4FF"/>
    <path d="M9 14 C9 11 11 10 13 10" fill="none" stroke="#FFF6E9" stroke-width="1.4" stroke-linecap="round"/>
  </symbol>

  <symbol id="ic-am-suite" viewBox="0 0 24 24"><!-- armchair -->
    <rect x="4" y="9" width="16" height="8" rx="2.5" fill="#FF2E88"/>
    <rect x="4" y="4" width="16" height="6" rx="2.5" fill="#FFE7F1"/>
    <rect x="2" y="12" width="3" height="8" rx="1.2" fill="#2B1E16"/>
    <rect x="19" y="12" width="3" height="8" rx="1.2" fill="#2B1E16"/>
  </symbol>

  <symbol id="ic-am-tan" viewBox="0 0 24 24"><!-- sun -->
    <circle cx="12" cy="12" r="5" fill="#FFC800"/>
    <path d="M12 2 V5 M12 19 V22 M2 12 H5 M19 12 H22 M4.9 4.9 L7 7 M17 17 L19.1 19.1 M19.1 4.9 L17 7 M7 17 L4.9 19.1" stroke="#FFC800" stroke-width="2" stroke-linecap="round"/>
  </symbol>

  <symbol id="ic-am-wellness" viewBox="0 0 24 24"><!-- heart -->
    <path d="M12 20 C4 14.5 2 10.5 4.5 7.2 C6.6 4.4 10.6 5 12 8 C13.4 5 17.4 4.4 19.5 7.2 C22 10.5 20 14.5 12 20 Z" fill="#FF2E88"/>
  </symbol>

  <symbol id="ic-am-yacht" viewBox="0 0 24 24">
    <path d="M3 15 H21 L18 21 H6 Z" fill="#45C4FF"/>
    <path d="M12 14 V3 L18 14 Z" fill="#FFF6E9"/>
    <rect x="11.3" y="3" width="1.4" height="11" fill="#2B1E16"/>
  </symbol>

  <!-- Phase 6A path-exclusive amenity tags (js/data/amenities.js) -->

  <symbol id="ic-am-vlogkit" viewBox="0 0 24 24"><!-- ring light + phone -->
    <circle cx="12" cy="12" r="9" fill="none" stroke="#FF2E88" stroke-width="2.4"/>
    <rect x="9" y="7" width="6" height="10" rx="1.5" fill="#2B1E16"/>
    <circle cx="12" cy="15" r="1" fill="#45C4FF"/>
  </symbol>

  <symbol id="ic-am-cryptodesk" viewBox="0 0 24 24"><!-- framed candle chart -->
    <rect x="3" y="4" width="18" height="14" rx="2" fill="#FFF6E9" stroke="#FFC800" stroke-width="2"/>
    <path d="M6 14 L9 9 L12 12 L15 6 L18 10" fill="none" stroke="#2B1E16" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="9" y="18" width="6" height="3" rx="1" fill="#E8B979"/>
  </symbol>

  <symbol id="ic-am-wanderkit" viewBox="0 0 24 24"><!-- compass -->
    <circle cx="12" cy="12" r="9" fill="#7ED957"/>
    <path d="M15 8 L11 13 L9 16 L13 11 Z" fill="#FFF6E9"/>
    <circle cx="12" cy="12" r="1.4" fill="#2B1E16"/>
  </symbol>

  <symbol id="ic-am-atelier" viewBox="0 0 24 24"><!-- framed canvas + easel -->
    <rect x="3" y="3" width="18" height="14" rx="1.5" fill="#E8B979"/>
    <rect x="5.5" y="5.5" width="13" height="9" fill="#45C4FF"/>
    <path d="M9 21 L12 17 L15 21 Z" fill="#2B1E16"/>
  </symbol>

</svg>
